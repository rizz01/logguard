[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logguard"
version = "1.0.0"
description = "Detect SSH brute-force and password-spraying activity in Linux auth logs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Shaik Mohammed Rizwan" }]

[project.scripts]
logguard = "logguard.cli:main"

[tool.setuptools]
packages = ["logguard"]
